name: CI Monorepo Check

on:
  pull_request:
    paths:
      - "cli/**"
      - "packages/**"
      - "website/**"
      - "docs/**"
      - "justfile"
      - "cli/justfile"
      - "website/justfile"
      - ".github/workflows/ci-monorepo-check.yml"
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "packages/**"
      - "website/**"
      - "docs/**"
      - "justfile"
      - "cli/justfile"
      - "website/justfile"
      - ".github/workflows/ci-monorepo-check.yml"
  workflow_dispatch:

jobs:
  check:
    name: Root just check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Just
        uses: taiki-e/install-action@just

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        # One `dart pub get` resolves the whole pub workspace (see root
        # pubspec.yaml), plus `npm ci` for the site.
        run: just deps

      - name: Run monorepo quality gate
        # format + gen-check + analyze + test + layer hygiene + site build.
        run: just check

      - name: Verify local site output (act)
        if: ${{ env.ACT }}
        run: ls -la website/.vitepress/dist

      - name: Upload site artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: getglue-site
          path: website/.vitepress/dist
          if-no-files-found: error
